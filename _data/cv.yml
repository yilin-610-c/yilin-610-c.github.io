- title: Research Experience
  type: time_table
  contents:
    - title: Hardware-Aware KV-Cache Quantization for Efficient LLM Serving
      institution: HKUST(GZ)
      year: 2026–Present
      description:
        - "May 2026–Present; supervisor: Prof. Zeyi Wen."
        - Investigating quantization error, activation distributions, and accuracy–execution trade-offs in low-bit KV caches.
        - Developing and evaluating quantization algorithms, calibration approaches, and scale selection through numerical diagnostics and ablation studies.
        - Contributing literature analysis, figures, and writing; collaborating with teammates responsible for GPU kernels, serving integration, and system benchmarking.
    - title: Reliable On-Device AI Agents and Real-World Evaluation
      institution: MBZUAI Undergraduate Research Internship Program (UGRIP 2026)
      year: 2026–Present
      description:
        - "June 2026–Present; supervisors: Prof. Chun Jason Xue and Prof. Youcheng Sun. Continued collaboration after the summer internship."
        - Exploring demonstration-to-skill workflows and token-efficient execution; prototyping a cross-app personal knowledge base in Python and Android.
        - Deploying and testing cross-session memory on real devices; debugging benchmark setup, Android automation, memory integration, and result verification.
        - Contributing prototyping and evaluation reliability within the team's broader benchmark effort.
    - title: "AgenticMath: Multi-Agent Mathematical Data Synthesis"
      institution: HKUST(GZ)
      year: 2025–2026
      description:
        - "May 2025–May 2026; supervisor: Prof. Jiaheng Wei."
        - Reviewed mathematical data synthesis methods and engineered a multi-agent pipeline for seed selection, question reformulation, answer refinement, and quality evaluation.
        - Fine-tuned 3B–8B LLMs and conducted in-domain and out-of-domain evaluations.
        - The collaborative study demonstrated competitive reasoning performance using 30–60K synthesized examples on the evaluated benchmarks.

- title: Final-Year Project
  type: time_table
  contents:
    - title: Benchmarking AI Agents for Quantization Kernel Development
      institution: HKUST(GZ)
      year: In progress
      description:
        - Investigating how to systematically evaluate coding agents on quantization-related GPU kernel tasks.
        - Potential evaluation dimensions include functional correctness, numerical accuracy, performance, robustness, and reproducibility.
        - Scope and methodology are under development; these are research objectives, with no release or results reported.

